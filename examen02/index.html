<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Países UE - Tus Iniciales</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

<main>
    <h1>Países UE - Martín Sierra Godínez</h1>
    <p><strong>Elige un idioma:</strong></p>
    <input type="checkbox" id="cbIdiomaOfi">
    <label for="cbIdiomaOfi">Solo idiomas oficiales:</label>

    <div id="listaPaisesRadio"></div>

    <div id="infoFiltro"></div>

    <div id="contenedorPaises">
        <table id="tablaPaises">
            <thead>
            <tr>
                <th>País</th>
                <th>Capital</th>
                <th>Población <br><small id="totalPoblacionHeader"></small></th>
                <th>Fecha adhesión</th>
            </tr>
            </thead>
            <tbody id="cuerpoTablaPaises">
            </tbody>
        </table>
    </div>
</main>

<script type="module" src="script.js"></script>
</body>
</html>
